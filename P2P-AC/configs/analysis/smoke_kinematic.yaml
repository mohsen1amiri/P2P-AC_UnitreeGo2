# Same structure as paper.yaml, for the kinematic smoke sweep (configs/experiments/smoke_kinematic.yaml).
runs_root: runs_smoke
total_steps: 4000
n80_threshold: 0.8
curve_grid_step: 1000
band: std
curves:
  - {file: data_ddpg.csv,     experiment: smoke, run: base-ddpg}
  - {file: data_p2pddpg.csv,  experiment: smoke, run: p2p-ddpg}
  - {file: data_td3.csv,      experiment: smoke, run: base-td3}
  - {file: data_p2ptd3.csv,   experiment: smoke, run: p2p-td3}
  - {file: data_sac.csv,      experiment: smoke, run: base-sac}
  - {file: data_p2psac.csv,   experiment: smoke, run: p2p-sac}
  - {file: data_accelsac.csv, experiment: smoke, run: accel-sac}
  - {file: data_ppo.csv,      experiment: smoke, run: base-ppo}
tables:
  table2_main:
    columns: [n80, success, crash, path_ratio, duration_s, speed]
    rows:
      - {label: "SAC",                 experiment: smoke, run: base-sac}
      - {label: "P2P-SAC",             experiment: smoke, run: p2p-sac}
      - {label: "Accel. SAC",          experiment: smoke, run: accel-sac}
      - {label: "PPO",                 experiment: smoke, run: base-ppo}
      - {label: "Planner (reference)", experiment: smoke, run: planner__budget_20, reference: true}
  table3_ablation:
    columns: [n80, success]
    rows:
      - {label: "P2P-SAC",               experiment: smoke, run: p2p-sac}
      - {label: "Without planner phase", experiment: smoke, run: p2p-sac__no_planner_phase}
      - {label: "Without imitation",     experiment: smoke, run: p2p-sac__no_imitation}
      - {label: "Imitation on actions",  experiment: smoke, run: p2p-sac__action_imitation}
      - {label: "Single buffer",         experiment: smoke, run: p2p-sac__single_buffer}
      - {label: "Immediate removal",     experiment: smoke, run: p2p-sac__immediate_removal}
budget_sweep:
  planner_experiment: smoke
  points:
    - {iterations: 20, experiment: smoke, run: p2p-sac, planner_run: planner__budget_20}
