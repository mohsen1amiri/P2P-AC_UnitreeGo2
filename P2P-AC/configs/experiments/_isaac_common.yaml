# Settings shared by every Isaac Lab experiment of the paper. The other experiment files include this one
# ("include: [_isaac_common.yaml]"). Change a value here and it changes for every experiment; the value used
# is always saved in each run's config.json.
#
#   common:  option values (same names as the command-line flags, with underscores) added to every run
#   slurm:   how the runs are packed into SLURM jobs (see README, "Running on a SLURM cluster")
common:
  backend: isaac
  output_root: runs
  total_steps: 5000000          # training budget per run (Fig. 2 x-axis)
  max_episode_steps: 8000       # T_max (Sec. VI-A)
  eval_every: 100000            # evaluate the policy every 1e5 environment steps
  eval_episodes: 20             # episodes per evaluation (fixed start positions)
  eval_final_episodes: 100      # episodes of the final evaluation (Table II)
  checkpoint_every: 250000      # resumable checkpoint every 2.5e5 steps
  gamma: 0.99                   # discount factor
slurm:                          # GPU type, account, partition, CPUs, memory: scripts/cluster.env (cluster specific)
  runs_per_job: 3               # three Isaac Sim instances share one GPU
  time: "7-00:00:00"            # wall time per job; P2PAC_SLURM_TIME in scripts/cluster.env overrides it. Runs are
                                # checkpointed and the job is requeued when the time is up, so any limit works.
  stagger_s: 120                # seconds between the start of the runs inside one job (avoids start-up contention)
